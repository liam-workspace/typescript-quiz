name: CI

on:
  pull_request:

jobs:
  checks:
    name: Format, lint & test
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]' || contains(github.event.pull_request.labels.*.name, 'javascript')
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 25
          cache: pnpm

      # npm.pkg.github.com requires a token even for public packages, and
      # .npmrc reads it from NODE_AUTH_TOKEN. Without this the install of
      # @liam-workspace/platform fails 401 and every PR dies here.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check formatting
        run: pnpm format

      - name: Lint
        run: pnpm lint

      # The db suite starts a PostgreSQL 16 container through Testcontainers,
      # which ubuntu-latest supports out of the box -- no `services:` block is
      # needed, and adding one would give the suite a second database it does
      # not use.
      - name: Test
        run: pnpm test
