# On a semver tag push, tell liam-workspace/ai-devops to build + deploy quiz.
# Requires repo secret DISPATCH_TOKEN: a PAT with repository_dispatch rights on liam-workspace/ai-devops.
name: Deploy Dispatch

'on':
  push:
    tags:
      - 'v*.*.*'

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Send app-trigger to platform pipeline
        env:
          TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/liam-workspace/ai-devops/dispatches" \
            -d "$(jq -n \
                  --arg project "${GITHUB_REPOSITORY##*/}" \
                  --arg owner   "${GITHUB_REPOSITORY%%/*}" \
                  --arg app     "quiz" \
                  --arg ref     "${TAG}" \
                  --arg sha     "${GITHUB_SHA}" \
                  '{event_type:"app-trigger",client_payload:{upstream_project:$project,upstream_owner:$owner,upstream_app:$app,upstream_ref:$ref,upstream_sha:$sha}}')"
          echo "==> dispatched app-trigger for quiz ${TAG} (${GITHUB_SHA})"
