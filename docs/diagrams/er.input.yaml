# ER input document for the TOEFL Primary practice-test app (proposed schema).
# Hand-authored from the design: no migrations exist on disk yet.
# Content is fully normalized; every content row is copied per test_version,
# which is immutable once published so historical scores can never drift.
title: TOEFL Primary practice-test data model
entities:
  - name: STUDENT
    attributes:
      - { name: id, type: uuid, key: PK }
      - { name: subject_claim, type: text, key: UK }
      - { name: email, type: text }
      - { name: display_name, type: text }
      - { name: level, type: text }
  - name: TEST
    attributes:
      - { name: id, type: uuid, key: PK }
      - { name: slug, type: text, key: UK }
      - { name: title, type: text }
      - { name: status, type: text }
      - { name: current_version_id, type: uuid, key: FK }
  - name: TEST_VERSION
    attributes:
      - { name: id, type: uuid, key: PK }
      - { name: test_id, type: uuid, key: FK }
      - { name: version, type: int }
      - { name: duration_seconds, type: int }
      - { name: published_at, type: timestamptz }
  - name: TEST_SECTION
    attributes:
      - { name: id, type: uuid, key: PK }
      - { name: test_version_id, type: uuid, key: FK }
      - { name: ordinal, type: int }
      - { name: title, type: text }
      - { name: type, type: section_type }
      - { name: duration_seconds, type: int }
      - { name: navigation, type: nav_mode }
      - { name: allow_answer_change, type: boolean }
  - name: STIMULUS
    attributes:
      - { name: id, type: uuid, key: PK }
      - { name: test_version_id, type: uuid, key: FK }
      - { name: media_asset_id, type: uuid, key: FK }
      - { name: type, type: stimulus_type }
      - { name: title, type: text }
      - { name: body_text, type: text }
      - { name: max_plays, type: int }
      - { name: allow_pause, type: boolean }
      - { name: allow_seek, type: boolean }
  - name: QUESTION_GROUP
    attributes:
      - { name: id, type: uuid, key: PK }
      - { name: test_section_id, type: uuid, key: FK }
      - { name: stimulus_id, type: uuid, key: FK }
      - { name: ordinal, type: int }
  - name: QUESTION
    attributes:
      - { name: id, type: uuid, key: PK }
      - { name: test_version_id, type: uuid, key: FK }
      - { name: question_group_id, type: uuid, key: FK }
      - { name: question_key, type: text }
      - { name: ordinal, type: int }
      - { name: prompt, type: text }
      - { name: type, type: question_type }
      - { name: points, type: int }
  - name: CHOICE
    attributes:
      - { name: id, type: uuid, key: PK }
      - { name: question_id, type: uuid, key: FK }
      - { name: ordinal, type: int }
      - { name: label, type: text }
      - { name: is_correct, type: boolean }
  - name: QUESTION_TAG
    attributes:
      - { name: question_id, type: uuid, key: PK }
      - { name: tag, type: text, key: PK }
  - name: MEDIA_ASSET
    attributes:
      - { name: id, type: uuid, key: PK }
      - { name: kind, type: text }
      - { name: filename, type: text }
      - { name: mime_type, type: text }
      - { name: byte_size, type: bigint }
      - { name: checksum, type: text }
  - name: ATTEMPT
    attributes:
      - { name: id, type: uuid, key: PK }
      - { name: student_id, type: uuid, key: FK }
      - { name: test_version_id, type: uuid, key: FK }
      - { name: status, type: attempt_status }
      - { name: started_at, type: timestamptz }
      - { name: expires_at, type: timestamptz }
      - { name: submitted_at, type: timestamptz }
      - { name: current_question_id, type: uuid, key: FK }
  - name: ATTEMPT_SECTION
    attributes:
      - { name: attempt_id, type: uuid, key: PK }
      - { name: test_section_id, type: uuid, key: PK }
      - { name: entered_at, type: timestamptz }
      - { name: expires_at, type: timestamptz }
      - { name: completed_at, type: timestamptz }
  - name: RESPONSE
    attributes:
      - { name: attempt_id, type: uuid, key: PK }
      - { name: question_id, type: uuid, key: PK }
      - { name: test_version_id, type: uuid, key: FK }
      - { name: answered_at, type: timestamptz }
      - { name: time_spent_ms, type: int }
  - name: RESPONSE_CHOICE
    attributes:
      - { name: attempt_id, type: uuid, key: PK }
      - { name: question_id, type: uuid, key: PK }
      - { name: choice_id, type: uuid, key: PK }
  - name: STIMULUS_PLAY
    attributes:
      - { name: attempt_id, type: uuid, key: PK }
      - { name: stimulus_id, type: uuid, key: PK }
      - { name: play_count, type: int }
relations:
  - { from: STUDENT, to: ATTEMPT, cardinality: "one-to-many", label: takes }
  - { from: TEST, to: TEST_VERSION, cardinality: "one-to-many", label: "has version" }
  - { from: TEST_VERSION, to: TEST_SECTION, cardinality: "one-to-many", label: contains }
  - { from: TEST_VERSION, to: STIMULUS, cardinality: "one-to-many", label: owns }
  - { from: TEST_SECTION, to: QUESTION_GROUP, cardinality: "one-to-many", label: contains }
  - { from: STIMULUS, to: QUESTION_GROUP, cardinality: "one-to-many", label: introduces }
  - { from: QUESTION_GROUP, to: QUESTION, cardinality: "one-to-many", label: contains }
  - { from: QUESTION, to: CHOICE, cardinality: "one-to-many", label: offers }
  - { from: QUESTION, to: QUESTION_TAG, cardinality: "one-to-many", label: "tagged with" }
  - { from: MEDIA_ASSET, to: STIMULUS, cardinality: "one-to-many", label: "played by" }
  - { from: TEST_VERSION, to: ATTEMPT, cardinality: "one-to-many", label: "pinned by" }
  - { from: ATTEMPT, to: ATTEMPT_SECTION, cardinality: "one-to-many", label: times }
  - { from: TEST_SECTION, to: ATTEMPT_SECTION, cardinality: "one-to-many", label: "timed in" }
  - { from: ATTEMPT, to: RESPONSE, cardinality: "one-to-many", label: records }
  - { from: QUESTION, to: RESPONSE, cardinality: "one-to-many", label: "answered by" }
  - { from: RESPONSE, to: RESPONSE_CHOICE, cardinality: "one-to-many", label: selects }
  - { from: CHOICE, to: RESPONSE_CHOICE, cardinality: "one-to-many", label: "selected as" }
  - { from: ATTEMPT, to: STIMULUS_PLAY, cardinality: "one-to-many", label: counts }
  - { from: STIMULUS, to: STIMULUS_PLAY, cardinality: "one-to-many", label: "counted in" }
